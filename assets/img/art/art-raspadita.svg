<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" role="img" aria-label="Ilustración de tarjeta raspadita">
  <defs>
    <image id="logo" x="-45.5" y="-42" width="91" height="64" href="data:image/png;base64,"/>
    <g id="cat">
      <circle cx="0" cy="0" r="28"/>
      <path d="M-30,-4 L-19,-48 L-3,-6 Z"/>
      <path d="M30,-4 L19,-48 L3,-6 Z"/>
    </g>
    <pattern id="scratch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <rect width="7" height="16" fill="#3A3A3A"/>
      <rect x="7" width="3" height="16" fill="#5A5A5A"/>
    </pattern>
  </defs>
  <rect width="900" height="1125" fill="#EFE6D5"/>
  <circle cx="470" cy="520" r="290" fill="#B4553A" opacity=".18"/>
  <circle cx="740" cy="212" r="120" fill="#B4553A"/>

  <!-- tarjeta -->
  <g transform="translate(430,560) rotate(-5)">
    <rect x="-190" y="-280" width="380" height="560" rx="14" fill="#FBF6EC" stroke="#141414" stroke-width="6"/>
    <g transform="translate(0,-176)" fill="#141414"><use href="#logo"/></g>
    <g fill="#141414" opacity=".85">
      <rect x="-120" y="-104" width="240" height="14" rx="7"/>
      <rect x="-80" y="-68" width="160" height="8" rx="4" opacity=".55"/>
    </g>
    <g transform="translate(0,60)">
      <rect x="-140" y="-84" width="280" height="168" rx="10" fill="url(#scratch)" stroke="#141414" stroke-width="5"/>
      <rect x="-140" y="-84" width="280" height="168" rx="10" fill="none" stroke="#FBF6EC" stroke-width="3" stroke-dasharray="10 9" opacity=".7"/>
    </g>
    <g fill="#141414" opacity=".6">
      <rect x="-96" y="128" width="192" height="8" rx="4"/>
      <rect x="-56" y="152" width="112" height="8" rx="4"/>
    </g>
    <g fill="#B4553A">
      <rect x="-190" y="-280" width="380" height="10" rx="5"/>
    </g>
  </g>

  <!-- moneda -->
  <g transform="translate(660,790)">
    <circle r="86" fill="#E3D2B4" stroke="#141414" stroke-width="6"/>
    <circle r="66" fill="none" stroke="#141414" stroke-width="2" stroke-dasharray="5 7"/>
    <path d="M0,-38 l11,25 27,3 -20,19 6,27 -24,-14 -24,14 6,-27 -20,-19 27,-3 z" fill="#141414"/>
  </g>

  <!-- destellos -->
  <g fill="#141414">
    <path d="M170,320 l11,30 30,11 -30,11 -11 30 -11 -30 -30 -11 30 -11 z"/>
    <path d="M200,960 l8,22 22,8 -22 8 -8 22 -8 -22 -22 -8 22 -8 z"/>
    <path d="M770,1010 l8,22 22,8 -22 8 -8 22 -8 -22 -22 -8 22 -8 z"/>
  </g>
  <g fill="#B4553A">
    <circle cx="150" cy="760" r="12"/>
    <circle cx="806" cy="560" r="10"/>
  </g>
</svg>
